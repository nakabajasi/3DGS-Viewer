<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>3DGS Viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }

  .panel {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(18,21,26,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
    padding: 12px 14px; color: #e7eaee; font-size: 13px; line-height: 1.5;
    max-width: 280px; user-select: none;
  }
  .panel h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; letter-spacing: .02em; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  button {
    appearance: none; border: 1px solid rgba(255,255,255,.14); background: #20262e;
    color: #e7eaee; padding: 7px 11px; border-radius: 7px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #2a323c; }
  button:active { transform: translateY(1px); }
  .keys { color: #9aa4af; font-size: 11px; margin-top: 6px; }
  .keys b { color: #cfd6dd; font-weight: 600; }
  #status { margin-top: 8px; color: #7fd1a3; font-size: 11px; min-height: 14px; word-break: break-all; }
  #status.err { color: #f08c8c; }
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: #8b94a0; font-size: 12px; background: rgba(18,21,26,.7); padding: 6px 12px; border-radius: 8px;
    pointer-events: none;
  }
  #fps { position: fixed; top: 12px; right: 12px; z-index: 10; color: #6b747f; font-size: 11px;
         background: rgba(18,21,26,.6); padding: 4px 8px; border-radius: 6px; }
  input[type=file] { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
  }
}
</script>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="panel">
  <h1>3D Gaussian Splat Viewer</h1>
  <div class="row">
    <button id="openBtn">PLYを開く</button>
    <button id="sampleBtn">サンプル</button>
    <button id="flipBtn">上下反転</button>
  </div>
  <div class="keys">
    <b>W/A/S/D</b> 移動 ・ <b>Q/E</b> 下/上 ・ <b>Shift</b> 加速<br>
    <b>左ドラッグ</b> 視点回転 ・ <b>ホイールドラッグ</b> 平行移動<br>
    <b>ホイール回転</b> 前後 ・ <b>R</b> ビューをリセット
  </div>
  <div id="status">PLYファイルをドラッグ＆ドロップ、または「PLYを開く」</div>
</div>
<div id="fps"></div>
<div id="hint">ファイルをこのウィンドウにドロップできます</div>
<input id="fileInput" type="file" accept=".ply,.splat,.ksplat,.spz,.sog,.zip" />

<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

// ---- 基本セットアップ -------------------------------------------------------
const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 0, 4);

// Sparkのレンダラ（深度ソート等を担当）をシーンに追加
const spark = new SparkRenderer({ renderer });
scene.add(spark);

let currentMesh = null;
let flipped = false;          // 上下反転トグル
let moveSpeed = 1.0;          // モデルサイズに応じて自動調整
let sceneScale = 1.0;         // モデル対角長（パン・ドリー速度の基準）
let homeView = null;          // Rキー用にロード時の視点を保持

// ---- カメラ制御（フライ + マウスルック） ------------------------------------
const move = { f: 0, b: 0, l: 0, r: 0, u: 0, d: 0 };
let boost = false;
let yaw = 0, pitch = 0;       // YXZオーダーで適用（ロール混入を防止）
let lastX = 0, lastY = 0;

const KEYMAP = { KeyW: "f", KeyS: "b", KeyA: "l", KeyD: "r", KeyQ: "d", KeyE: "u" };
window.addEventListener("keydown", (e) => {
  if (KEYMAP[e.code]) { move[KEYMAP[e.code]] = 1; e.preventDefault(); }
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") boost = true;
  if (e.code === "KeyR") resetView();
});
window.addEventListener("keyup", (e) => {
  if (KEYMAP[e.code]) move[KEYMAP[e.code]] = 0;
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") boost = false;
});

// ドラッグ状態: 0=なし, 1=回転(左), 2=パン(中ボタン)
let dragMode = 0;
// 中ボタンの自動スクロール（ブラウザ既定動作）を抑止
canvas.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); });

canvas.addEventListener("pointerdown", (e) => {
  if (e.button === 0) dragMode = 1;
  else if (e.button === 1) dragMode = 2;
  else return;
  e.preventDefault();
  lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointerup", () => { dragMode = 0; canvas.classList.remove("dragging"); });
canvas.addEventListener("pointermove", (e) => {
  if (!dragMode) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (dragMode === 1) {
    // 視点回転
    yaw -= dx * 0.0025;
    pitch -= dy * 0.0025;
    const lim = Math.PI / 2 - 0.01;
    pitch = Math.max(-lim, Math.min(lim, pitch));
  } else {
    // パン（画面に対して水平・垂直に平行移動。掴んで動かす感覚）
    const k = sceneScale * 0.0015;
    _right.set(1, 0, 0).applyQuaternion(camera.quaternion);
    _panUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
    camera.position.addScaledVector(_right, -dx * k);
    camera.position.addScaledVector(_panUp, dy * k);
  }
});

// ホイール回転で前後（ドリー）
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  const step = -Math.sign(e.deltaY) * sceneScale * 0.08;
  camera.position.addScaledVector(_fwd, step);
}, { passive: false });

const _fwd = new THREE.Vector3();
const _right = new THREE.Vector3();
const _panUp = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _vel = new THREE.Vector3();        // 現在速度（減衰で目標へ追従）
const _target = new THREE.Vector3();     // 入力から決まる目標速度
const _euler = new THREE.Euler(0, 0, 0, "YXZ");

function updateCamera(dt) {
  _euler.set(pitch, yaw, 0, "YXZ");
  camera.quaternion.setFromEuler(_euler);
  _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _right.set(1, 0, 0).applyQuaternion(camera.quaternion);

  // 入力 → 目標速度
  _target.set(0, 0, 0);
  if (move.f) _target.add(_fwd);
  if (move.b) _target.sub(_fwd);
  if (move.r) _target.add(_right);
  if (move.l) _target.sub(_right);
  if (move.u) _target.add(_up);
  if (move.d) _target.sub(_up);
  if (_target.lengthSq() > 0) {
    _target.normalize().multiplyScalar(moveSpeed * (boost ? 4 : 1));
  }

  // フレームレート非依存の指数スムージングで加減速 → カクつき解消
  const a = 1 - Math.exp(-dt * 12);
  _vel.lerp(_target, a);
  camera.position.addScaledVector(_vel, dt);
}

// ---- ロード処理 -------------------------------------------------------------
const statusEl = document.getElementById("status");
function setStatus(msg, isErr = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("err", isErr);
}

async function swapMesh(mesh, label) {
  try {
    await mesh.initialized;
  } catch (err) {
    setStatus("読み込み失敗: " + (err?.message || err), true);
    mesh.dispose?.();
    return;
  }
  if (currentMesh) { scene.remove(currentMesh); currentMesh.dispose(); }
  currentMesh = mesh;
  applyOrientation();
  scene.add(mesh);
  frameCamera(mesh);
  const n = (mesh.numSplats ?? 0).toLocaleString();
  setStatus(`${label} — ${n} splats`);
}

async function loadFromFile(file) {
  setStatus(`読み込み中: ${file.name}`);
  const buf = await file.arrayBuffer();
  const mesh = new SplatMesh({
    fileBytes: new Uint8Array(buf),
    fileName: file.name,
    onProgress: (e) => {
      if (e.lengthComputable) setStatus(`デコード中 ${Math.round((e.loaded / e.total) * 100)}%`);
    },
  });
  await swapMesh(mesh, file.name);
}

async function loadFromURL(url) {
  setStatus(`読み込み中: ${url.split("/").pop()}`);
  const mesh = new SplatMesh({
    url,
    onProgress: (e) => {
      if (e.lengthComputable) setStatus(`ダウンロード中 ${Math.round((e.loaded / e.total) * 100)}%`);
    },
  });
  await swapMesh(mesh, url.split("/").pop());
}

// ---- 向き・カメラの自動調整 -------------------------------------------------
function applyOrientation() {
  if (!currentMesh) return;
  // 標準的な3DGSはY-downで上下逆に出ることが多い → X軸180°で反転
  currentMesh.rotation.set(flipped ? Math.PI : 0, 0, 0);
  currentMesh.updateMatrixWorld(true);
}

function frameCamera(mesh) {
  mesh.updateMatrixWorld(true);
  const box = mesh.getBoundingBox(true);     // 中心座標ベースのAABB
  box.applyMatrix4(mesh.matrixWorld);        // メッシュ変換をワールドへ反映
  const center = box.getCenter(new THREE.Vector3());
  const size = Math.max(box.getSize(new THREE.Vector3()).length(), 0.001);

  const dist = size * 0.7;
  camera.position.copy(center).add(new THREE.Vector3(0, 0, dist));
  camera.lookAt(center);
  const e = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
  yaw = e.y; pitch = e.x;

  moveSpeed = size * 0.12;
  sceneScale = size;
  camera.near = size / 1000;
  camera.far = size * 20;
  camera.updateProjectionMatrix();

  homeView = { pos: camera.position.clone(), yaw, pitch };
}

function resetView() {
  if (!homeView) return;
  camera.position.copy(homeView.pos);
  yaw = homeView.yaw; pitch = homeView.pitch;
}

// ---- UI ---------------------------------------------------------------------
const fileInput = document.getElementById("fileInput");
document.getElementById("openBtn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => { if (e.target.files[0]) loadFromFile(e.target.files[0]); });

document.getElementById("flipBtn").addEventListener("click", () => {
  flipped = !flipped;
  applyOrientation();
  if (currentMesh) frameCamera(currentMesh);
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  // 動作確認用サンプル（SparkのCORS対応アセット）
  loadFromURL("https://sparkjs.dev/assets/splats/butterfly.spz");
});

// ドラッグ＆ドロップ
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if (f) loadFromFile(f);
});

// ---- ループ -----------------------------------------------------------------
const fpsEl = document.getElementById("fps");
let last = performance.now(), frames = 0, fpsT = last;
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  updateCamera(dt);
  renderer.render(scene, camera);

  frames++;
  if (now - fpsT >= 500) { fpsEl.textContent = Math.round((frames * 1000) / (now - fpsT)) + " fps"; frames = 0; fpsT = now; }
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
